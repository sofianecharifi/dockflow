<!-- page de configuration serveur  -->
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DockFlow - Configuration Serveur</title>
    <link href="./css/output.css" rel="stylesheet">
</head>

<body class="bg-[#0f172a] text-white font-sans antialiased min-h-screen flex items-center justify-center">
    <div id="server-page-root" class="w-full max-w-md px-4">

        <main role="main"
            class="bg-[#1e293b] border border-slate-700 rounded-2xl shadow-2xl p-8 sm:p-10 animate-slide-up">

            <div class="flex justify-center mb-6">
                <div
                    class="w-12 h-12 rounded-xl border border-slate-600 flex items-center justify-center bg-slate-800 hover:scale-110 transition-all duration-300 ease-out cursor-pointer">
                    <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#D0E4FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
                        <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
                        <line x1="6" y1="6" x2="6.01" y2="6"></line>
                        <line x1="6" y1="18" x2="6.01" y2="18"></line>
                    </svg>
                </div>
            </div>

            <header class="text-center mb-8">
                <h1 class="text-2xl font-bold text-white mb-2">Serveur DockFlow</h1>
                <p class="text-slate-400 text-sm">Entrez l'URL de votre serveur pour continuer</p>
            </header>

            <form action="#" method="POST" class="space-y-5">
                <div>
                    <label for="server_url" class="block text-sm font-medium text-slate-300 mb-1.5">Adresse du serveur</label>
                    <div class="relative">
                        <input type="url" id="server_url" name="server_url" placeholder="http://192.168.1.50:3000" required 
                            class="block w-full px-3 py-2 border border-slate-700 rounded-lg leading-5 bg-[#0f172a] text-slate-300 placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition duration-150 ease-in-out" />
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit"
                        class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-slate-900 bg-[#eff6ff] hover:bg-white hover:-translate-y-0.5 hover:shadow-md active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-400 focus:ring-offset-[#0f172a] transition-all duration-200 ease-in-out">
                        Enregistrer
                    </button>
                </div>
            </form>

        </main>
    </div>
</body>
<script src="js/pages/server.page.js" type="module"></script>
</html>
